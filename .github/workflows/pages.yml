# Publishes the tool to GitHub Pages on every push to main: the built single file becomes the site's index page.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Skipped while the repository is private (free GitHub Pages needs a public repository).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python3 build.py
          mkdir -p _site
          cp dist/lab-cpet-tool.html _site/index.html
          cp dist/lab-cpet-tool.html _site/lab-cpet-tool.html
          cp LICENSE THIRD_PARTY_NOTICES.md _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
